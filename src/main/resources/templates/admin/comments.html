<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header::head-fragment('评论治理')}"></head>
<body>
<div th:replace="~{header::header-fragment}"></div>
<link rel="stylesheet" th:href="@{/css/admin.css}">
<div class="admin-shell">
    <aside class="admin-sidebar"><div class="admin-brand">社区治理<small>内容与账号管理</small></div><nav class="admin-nav"><a th:href="@{/admin}">总览</a><a th:href="@{/admin/posts}">帖子治理</a><a class="active" th:href="@{/admin/comments}">评论治理</a><a th:href="@{/admin/users}">用户状态</a><a th:href="@{/admin/categories}">分类管理</a></nav></aside>
    <main class="admin-main"><header class="admin-page-head"><div><h1>评论治理</h1><p>按帖子、作者和时间定位评论</p></div></header>
        <section class="admin-panel"><form class="admin-toolbar" id="commentFilters">
            <select class="layui-select" name="status"><option value="">全部状态</option><option>NORMAL</option><option>HIDDEN</option><option>DELETED</option></select>
            <input class="layui-input" name="postId" type="number" min="1" placeholder="帖子 ID"><input class="layui-input" name="authorId" type="number" min="1" placeholder="作者 ID">
            <input class="layui-input" name="from" type="datetime-local" aria-label="开始时间"><input class="layui-input" name="to" type="datetime-local" aria-label="结束时间">
            <button class="layui-btn" type="submit"><i class="layui-icon layui-icon-search"></i>筛选</button>
        </form>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>评论</th><th>帖子</th><th>作者</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="commentRows"></tbody></table></div>
        <div class="admin-empty" id="commentEmpty" hidden>暂无符合条件的评论</div>
        <div class="admin-pager"><button class="layui-btn layui-btn-primary layui-btn-sm" id="commentPrev" type="button">上一页</button><span id="commentPage">第 1 页</span><button class="layui-btn layui-btn-primary layui-btn-sm" id="commentNext" type="button">下一页</button></div></section>
    </main>
</div>
<script th:src="@{/js/admin.js}"></script>
<script>
layui.use('layer', function () {
    var layer = layui.layer, page = 1, totalPages = 0;
    function query() { var form = new FormData(document.getElementById('commentFilters')), params = new URLSearchParams({page: page, size: 10}); ['status','postId','authorId'].forEach(function (key) { if (form.get(key)) params.set(key, form.get(key)); }); if (form.get('from')) params.set('from', BbsAdmin.iso(form.get('from'))); if (form.get('to')) params.set('to', BbsAdmin.iso(form.get('to'))); return params; }
    async function load() { try { var data = await BbsAdmin.api('/api/v1/admin/comments?' + query(), {method:'GET'}); totalPages = data.totalPages; document.getElementById('commentRows').innerHTML = data.list.map(row).join(''); document.getElementById('commentEmpty').hidden = data.list.length !== 0; document.getElementById('commentPage').textContent = '第 ' + data.page + ' / ' + Math.max(totalPages, 1) + ' 页'; document.getElementById('commentPrev').disabled = page <= 1; document.getElementById('commentNext').disabled = page >= totalPages; } catch (error) { layer.msg(error.message); } }
    function row(comment) { var e = BbsAdmin.escapeHtml, actions = comment.status === 'NORMAL' ? button(comment.id,'hide','隐藏','layui-btn-warm') : comment.status === 'HIDDEN' ? button(comment.id,'restore','恢复','') + button(comment.id,'delete','删除','layui-btn-danger') : '-'; return '<tr><td>'+e(comment.id)+'</td><td class="admin-title-cell">'+e(comment.body)+'</td><td><a href="/detail/'+e(comment.postId)+'" target="_blank">'+e(comment.postId)+'</a></td><td>'+e(comment.authorName || comment.authorId)+'</td><td><span class="admin-status '+e(comment.status)+'">'+e(comment.status)+'</span></td><td>'+e(BbsAdmin.formatTime(comment.createTime))+'</td><td><div class="admin-actions">'+actions+'</div></td></tr>'; }
    function button(id, action, label, css) { return '<button type="button" class="layui-btn layui-btn-xs '+css+'" data-id="'+id+'" data-action="'+action+'">'+label+'</button>'; }
    document.getElementById('commentRows').addEventListener('click', function(event) { var button = event.target.closest('button[data-action]'); if (!button) return; layer.prompt({title:'填写治理原因',formType:2}, async function(reason,promptIndex){ try { await BbsAdmin.api('/api/v1/admin/comments/'+button.dataset.id+'/'+button.dataset.action, BbsAdmin.json('POST',{reason:reason})); layer.close(promptIndex); layer.msg('操作成功'); load(); } catch(error){ layer.msg(error.message); } }); });
    document.getElementById('commentFilters').addEventListener('submit', function(event){event.preventDefault();page=1;load();}); document.getElementById('commentPrev').addEventListener('click',function(){if(page>1){page--;load();}}); document.getElementById('commentNext').addEventListener('click',function(){if(page<totalPages){page++;load();}}); load();
});
</script>
</body>
</html>
