<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head-fragment(title)">
    <meta charset="utf-8">
    <title th:text="${title}">首页</title>
    <link rel="shortcut icon" th:href="@{/images/my-bbs-icon.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <meta name="description" content="My-BBS,bbs,论坛,SpringBoot论坛,论坛系统,Java论坛,SpringBoot,spring-boot,java">
    <meta name="description" content="My BBS 是由 SpringBoot + Mybatis + Thymeleaf 等技术实现的 Java BBS论坛系统">
    <link rel="stylesheet" th:href="@{/layui/css/layui.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <script th:src="@{/layui/layui.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            if (csrfToken && csrfHeader && window.layui) {
                layui.use('jquery', function () {
                    layui.$.ajaxSetup({headers: {[csrfHeader]: csrfToken}});
                });
            }
        });
    </script>
</head>

<div th:fragment="header-fragment" class="fly-header layui-bg-black">
    <div class="layui-container">
        <a class="fly-logo" href="/">
            <img th:src="@{/images/my-bbs-logo.png}" alt="My-BBS">
        </a>
        <ul class="layui-nav fly-nav layui-hide-xs">
            <li class="layui-nav-item layui-this">
                <a href="https://www.lanqiao.cn/courses/4830"><i class="iconfont icon-wenda"></i>开发文档</a>
            </li>
            <li class="layui-nav-item">
                <a href="https://github.com/ZHENFENG13/My-BBS"><i class="iconfont icon-daima"></i>源码</a>
            </li>
            <li class="layui-nav-item layui-this">
                <a href="https://juejin.im/user/59199e22a22b9d0058279886"><i class="iconfont icon-jiaoliu"></i>交流</a>
            </li>
        </ul>

        <ul class="layui-nav fly-nav-user">

            <!-- 未登入的状态 -->
            <th:block th:if="${session.myBBSUser==null}">
                <li class="layui-nav-item">
                    <a class="iconfont icon-touxiang layui-hide-xs" href="user/login.html"></a>
                </li>
                <li class="layui-nav-item">
                    <a th:href="@{/login}">登入</a>
                </li>
                <li class="layui-nav-item">
                    <a th:href="@{/register}">注册</a>
                </li>
            </th:block>


            <!-- 登入后的状态 -->
            <th:block th:unless="${session.myBBSUser==null}">
                <li class="layui-nav-item">
                    <a class="fly-nav-avatar" href="javascript:;">
                        <cite class="layui-hide-xs" th:text="${session.myBBSUser.nickName}">程序员十三</cite>
                        <th:block th:if="${session.myBBSUser.gender=='男'}">
                            <i class="iconfont icon-nan"></i>
                        </th:block>
                        <th:block th:if="${session.myBBSUser.gender=='女'}">
                            <i class="iconfont icon-nv"></i>
                        </th:block>
                        <th:block th:if="${session.myBBSUser.gender=='未知'}">
                            <i class="iconfont icon-biaoqing"></i>
                        </th:block>
                        <img th:src="@{${session.myBBSUser.headImgUrl}}">
                        <span class="layui-nav-more"></span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd th:if="${session.myBBSUser.role == 'ADMIN'}">
                            <a th:href="@{/admin}"><i class="layui-icon">&#xe653;</i>管理后台</a>
                        </dd>
                        <dd><a th:href="@{/userSet}"><i class="layui-icon">&#xe620;</i>基本设置</a></dd>
                        <dd><a th:href="@{/myCenter}"><i class="layui-icon" style="margin-left: 2px; font-size: 22px;">&#xe68e;</i>我的主页</a>
                        </dd>
                        <hr style="margin: 5px 0;">
                        <dd>
                            <form th:action="@{/api/v1/auth/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="layui-btn layui-btn-primary layui-border-none"
                                        style="width: 100%;">退出</button>
                            </form>
                        </dd>
                    </dl>
                </li>
            </th:block>
        </ul>
    </div>

    <!-- 全局提示信息弹框：后端通过 model.addAttribute("messages", List.of("msg1","msg2")) 设置 -->
    <script th:inline="javascript" th:if="${messages != null and !#lists.isEmpty(messages)}">
        layui.use('layer', function() {
            var layer = layui.layer;
            var messages = /*[[${messages}]]*/ [];
            layer.msg(messages.join('<br>'), {
                icon: 0,
                time: 3000 + messages.length * 1000
            });
        });
    </script>
</div>
