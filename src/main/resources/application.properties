spring.application.name=BBS
server.port=8080
# Thymeleaf \u914D\u7F6E
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# \u6570\u636E\u6E90\u914D\u7F6E\uFF08HikariCP \u8FDE\u63A5\u6C60\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/my_bbs_db?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
# \u6587\u4EF6\u4E0A\u4F20\u5927\u5C0F\u9650\u5236
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# MyBatis-Plus \u914D\u7F6E
mybatis-plus.mapper-locations=classpath:mapper/*Mapper.xml
#\u7528\u4E8E\u5F00\u542F \u4E0B\u5212\u7EBF\u547D\u540D\u8F6C\u9A7C\u5CF0\u547D\u540D\u7684\u81EA\u52A8\u6620\u5C04\u529F\u80FD
mybatis-plus.configuration.map-underscore-to-camel-case=true
# \u6253\u5370 SQL \u65E5\u5FD7\uFF08\u5F00\u53D1\u9636\u6BB5\u65B9\u4FBF\u8C03\u8BD5\uFF09
logging.level.com.bbs.bbs.Mapper=debug
# Redis\u914D\u7F6E
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0 
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
